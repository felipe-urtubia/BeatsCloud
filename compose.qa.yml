services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env.qa}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env.qa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.qa}
    ports:
      - "127.0.0.1:${DB_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - qa-postgres-data:/var/lib/postgresql/data

volumes:
  qa-postgres-data:
