{% extends "base.html" %}
{% block titulo %}Recuperar contraseña{% endblock %}
{% block contenido %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 70vh">
  <div class="card border-0 shadow-lg" style="max-width: 480px; width: 100%;">
    <div class="card-body p-4">
      <h2 class="text-center">Recuperar contraseña</h2>
      <p class="text-muted">Ingresa el correo de tu cuenta. Te enviaremos un enlace seguro para crear una contraseña nueva.</p>
      <form method="post">
        {% csrf_token %}
        {{ form.email.errors }}
        <div class="form-group">
          <label for="id_email">Correo electrónico</label>
          <input type="email" name="email" autocomplete="email" maxlength="254" required id="id_email" class="form-control">
        </div>
        <button type="submit" class="btn btn-warning btn-block">Enviar enlace</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
