{% extends "base.html" %}
{% block titulo %}Confirma tu correo{% endblock %}
{% block contenido %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 70vh">
  <div class="card border-0 shadow-lg" style="max-width: 560px; width: 100%;">
    <div class="card-body text-center p-4">
      <h2>Revisa tu correo 📩</h2>
      <p class="mt-3">Enviamos un enlace de confirmación a:</p>
      <strong>{{ email }}</strong>
      <p class="mt-3 mb-0">Debes abrir ese enlace para activar tu cuenta antes de iniciar sesión.</p>
    </div>
  </div>
</div>
{% endblock %}
